<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구름은 어떻게 생길까! | 어게인 실험과학 수학학원</title>
<meta name="description" content="손으로 만지며 알아보는 단열 팽창과 구름, 비가 내리는 까닭">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#eaf4fb; --sky2:#b7d8ef; --blue:#1f7ac4; --blue-d:#145a96; --line:#d6e6f2;
  --orange:#f2a531; --orange-d:#a8680a; --orange-s:#fff4e1;
  --ruby:#d2364f; --ruby-d:#a0203a; --ink:#27384a; --sub:#627488;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-weight:500;background:#fff}
body{min-height:100vh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.jua,header,nav,.bbtn,.msg,.card,.read,.quiz,footer{font-family:"Jua",sans-serif}

.bbtn{font-size:22px;min-height:64px;min-width:140px;padding:10px 26px;color:#fff;background:var(--blue);border-radius:999px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 5px 0 var(--blue-d);word-break:keep-all}
.bbtn:active{transform:translateY(3px)}
.bbtn.orange{background:var(--orange);color:#432c03;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08),0 5px 0 var(--orange-d)}
.bbtn.white{background:#fff;color:var(--blue-d);box-shadow:inset 0 -6px 0 rgba(0,0,0,.05),0 5px 0 var(--line);border:3px solid var(--sky2)}
.bbtn.on{background:var(--orange-s);color:var(--orange-d);border-color:var(--orange);box-shadow:inset 0 -6px 0 rgba(0,0,0,.05),0 5px 0 var(--orange)}
.bbtn:disabled{opacity:.4;cursor:default}
.bbtn.on:disabled{opacity:1}

header{position:sticky;top:0;z-index:30;background:#fff;box-shadow:0 3px 0 var(--line);padding:10px 16px}
.head-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.titles{flex:1;min-width:0}
.brand{font-size:16px;color:var(--sub)}
h1{margin:0;font-weight:400;font-size:clamp(24px,4vw,34px);color:var(--blue-d);line-height:1.15;word-break:keep-all}
.share{min-width:0;font-size:18px;min-height:54px;padding:8px 22px}

nav{max-width:1100px;width:100%;margin:14px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{position:relative;min-height:66px;border-radius:20px;background:var(--sky);font-size:clamp(15px,2.1vw,20px);line-height:1.2;padding:6px;
  border:3px solid transparent;word-break:keep-all;text-align:center}
.tab.on{background:var(--orange-s);border-color:var(--orange);color:var(--orange-d)}
.tab .star{position:absolute;top:-12px;right:-2px;font-size:24px;color:#f2a531;display:none}
.tab.done .star{display:block;animation:pop .5s}

main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:16px}
.panel{display:none}
.panel.on{display:block;animation:fadein .3s}
.msg{background:var(--sky);border-radius:20px;padding:12px 18px;font-size:clamp(18px,2.4vw,23px);line-height:1.45;word-break:keep-all;margin-bottom:12px;min-height:calc(2.9em + 24px)}
.stage{position:relative;width:min(100%,max(52vh,300px),720px);margin:0 auto;border-radius:28px;overflow:hidden;box-shadow:0 0 0 3px var(--line);background:#f4f9fd}
.stage svg{display:block;width:100%;height:auto}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:16px}
.card{display:none;margin:16px auto 0;max-width:880px;border-radius:24px;background:var(--orange-s);border:4px solid var(--orange);padding:16px 20px;
  font-size:clamp(20px,2.7vw,26px);text-align:center;line-height:1.5;color:var(--ink);word-break:keep-all}
.card.on{display:block;animation:pop .5s}

/* 숫자 칸 */
.read{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.read div{min-width:132px;border-radius:18px;padding:5px 16px;font-size:20px;text-align:center;background:var(--sky);color:var(--blue-d)}
.read div.w{background:var(--orange-s);color:var(--orange-d)}
.read span{display:block;font-size:.8em;color:var(--sub)}
.read b{font-weight:400;font-size:1.5em}

/* 감압 용기 · 페트병 */
#plug{transition:transform .25s}
#plug.up{transform:translateY(-24px)}
#inair,#incense,#drp{transition:opacity .25s}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.steps .bbtn{min-width:0;font-size:clamp(16px,2vw,20px);padding:8px 10px;line-height:1.25}

/* 하늘로 올라가는 공기 */
#par{touch-action:none;cursor:grab}
#cu,#st,#rain,#ctype{transition:opacity .5s}
#hint3{animation:bob .8s ease-in-out infinite alternate}

.quiz{max-width:820px;margin:0 auto;text-align:center}
.score{font-size:22px;color:var(--sub)}
.score b{font-weight:400;color:var(--orange-d);font-size:1.3em}
.q{background:var(--sky);border-radius:28px;padding:28px 20px;margin:12px 0;font-size:clamp(24px,3.6vw,34px);line-height:1.4;word-break:keep-all;min-height:150px;display:grid;place-items:center}
.ox{display:flex;gap:20px;justify-content:center}
.ox button{width:min(42%,220px);aspect-ratio:1.3;border-radius:32px;font-size:clamp(70px,13vw,110px);line-height:1;color:#fff}
.ox .o{background:var(--blue);box-shadow:0 8px 0 var(--blue-d)}
.ox .x{background:var(--ruby);box-shadow:0 8px 0 var(--ruby-d)}
.ox button:active{transform:translateY(4px)}
.ox button:disabled{opacity:.4}
.fb{min-height:70px;margin-top:16px;font-size:clamp(20px,2.8vw,26px);line-height:1.4;word-break:keep-all}
.fb.good{color:#1f8a57}.fb.bad{color:#c8283a}

footer{background:var(--sky);padding:16px;text-align:center;font-size:17px;color:var(--blue-d);line-height:1.6}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:"Jua",sans-serif;font-size:20px;padding:12px 26px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99;white-space:nowrap}
.toast.on{opacity:1}
.conf{position:fixed;top:-20px;width:14px;height:14px;z-index:98;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes bob{to{transform:translateY(-10px)}}
svg text{font-family:"Jua",sans-serif}

@media (max-width:720px){ .steps{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){
  .msg{min-height:calc(5.8em + 24px)}
  .bbtn{font-size:19px;padding:10px 18px;min-width:0}
  .share{font-size:17px;padding:8px 16px}
  .read{gap:8px}
  .read div{min-width:98px;padding:5px 8px;font-size:16px}
  .card br.w{display:none}
}
</style>
</head>
<body>
<header><div class="head-in">
  <div class="titles"><div class="brand">어게인 실험과학 수학학원</div><h1>구름은 어떻게 생길까!</h1></div>
  <button class="bbtn orange share" id="share">공유하기</button>
</div></header>

<nav>
  <button class="tab on" data-t="0">감압 용기<span class="star">★</span></button>
  <button class="tab" data-t="1">페트병 구름<span class="star">★</span></button>
  <button class="tab" data-t="2">하늘로 올라가는 공기<span class="star">★</span></button>
  <button class="tab" data-t="3">OX 퀴즈<span class="star">★</span></button>
</nav>

<main>
<!-- 1 감압 용기 -->
<section class="panel on">
  <div class="msg" id="m0"></div>
  <div class="stage">
    <svg viewBox="0 0 600 460" role="img" aria-label="펌프와 압력계가 달린 투명한 감압 용기. 속에 종이 온도계와 물이 조금 들어 있다">
      <defs><clipPath id="jarIn"><rect x="153" y="153" width="254" height="274" rx="15"/></clipPath></defs>
      <rect width="600" height="460" fill="#f4f9fd"/>
      <rect y="436" width="600" height="24" fill="#e1ebf3"/>
      <!-- 검은 종이 (통 뒤) -->
      <rect x="128" y="140" width="304" height="296" rx="6" fill="#1c2a3a"/>
      <!-- 통 속 -->
      <g clip-path="url(#jarIn)">
        <rect id="fog" x="153" y="153" width="254" height="274" fill="#fff" opacity="0"/>
        <g id="drops0" fill="#fff"></g>
        <g id="specks" fill="#9aa7b4"></g>
        <rect x="153" y="408" width="254" height="19" fill="#4aa3e6"/>
      </g>
      <text x="398" y="400" font-size="22" fill="#9fd0f5" text-anchor="end">물</text>
      <g id="inair" fill="none" stroke="#7cc3f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" opacity="0">
        <path d="M355,158 V226"/><path d="M355,158 Q326,186 312,222"/><path d="M355,158 Q384,186 396,222"/>
      </g>
      <g id="strip0" transform="translate(166 172)"></g>
      <rect x="150" y="150" width="260" height="280" rx="18" fill="none" stroke="#9cc4e0" stroke-width="5"/>
      <path d="M392,176 V300" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".25"/>
      <path d="M122,280 H158" stroke="#627488" stroke-width="3" stroke-dasharray="5 5"/>
      <text x="116" y="274" font-size="20" fill="#627488" text-anchor="end">종이</text>
      <text x="116" y="298" font-size="20" fill="#627488" text-anchor="end">온도계</text>
      <!-- 뚜껑 · 펌프 · 마개 -->
      <rect x="140" y="128" width="280" height="26" rx="8" fill="#6f8aa3"/>
      <rect x="222" y="72" width="44" height="58" rx="6" fill="#e6eef5" stroke="#8aa5bd" stroke-width="3"/>
      <g id="ph"><rect x="240" y="44" width="8" height="40" fill="#6f8aa3"/><rect x="214" y="32" width="60" height="16" rx="8" fill="#1f7ac4"/></g>
      <text x="206" y="106" font-size="20" fill="#627488" text-anchor="end">펌프</text>
      <g id="plug"><rect x="336" y="112" width="38" height="22" rx="6" fill="#f2a531" stroke="#a8680a" stroke-width="3"/></g>
      <text x="386" y="118" font-size="20" fill="#627488">마개</text>
      <!-- 압력계 -->
      <path d="M420,141 H468" stroke="#8aa5bd" stroke-width="8"/>
      <circle cx="512" cy="120" r="52" fill="#fff" stroke="#8aa5bd" stroke-width="5"/>
      <path d="M477.4,140 A40,40 0 1 1 546.6,140" fill="none" stroke="#d6e6f2" stroke-width="8" stroke-linecap="round"/>
      <g stroke="#6f8aa3" stroke-width="3" stroke-linecap="round">
        <path d="M512,74 v10" transform="rotate(-72 512 120)"/><path d="M512,74 v10"/><path d="M512,74 v10" transform="rotate(72 512 120)"/>
      </g>
      <text x="512" y="154" font-size="15" fill="#627488" text-anchor="middle">hPa</text>
      <g id="ndl"><path d="M512,128 V84" stroke="#d2364f" stroke-width="4" stroke-linecap="round"/></g>
      <circle cx="512" cy="120" r="6" fill="#27384a"/>
      <text x="512" y="198" font-size="20" fill="#627488" text-anchor="middle">압력계</text>
      <!-- 향 -->
      <g id="incense" opacity="0">
        <path id="wisp" d="M360,114 Q344,150 358,188 Q372,226 350,264" fill="none" stroke="#dfe5ea" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 10" opacity=".85"/>
        <path d="M436,54 L362,110" stroke="#8a6a4a" stroke-width="4" stroke-linecap="round"/>
        <circle cx="362" cy="110" r="5" fill="#f2a531"/>
        <text x="444" y="50" font-size="20" fill="#627488">향</text>
      </g>
      <!-- 크게 보기 -->
      <g id="zoom0" opacity="0">
        <path d="M404,300 L449,316" stroke="#8aa5bd" stroke-width="3" stroke-dasharray="6 6"/>
        <circle cx="512" cy="318" r="64" fill="#1c2a3a" stroke="#9cc4e0" stroke-width="4"/>
        <circle class="zd" cx="490" cy="298" fill="#eaf5ff"/><circle cx="490" cy="298" r="5" fill="#9aa7b4"/>
        <circle class="zd" cx="538" cy="312" fill="#eaf5ff"/><circle cx="538" cy="312" r="5" fill="#9aa7b4"/>
        <circle class="zd" cx="506" cy="346" fill="#eaf5ff"/><circle cx="506" cy="346" r="5" fill="#9aa7b4"/>
        <text x="512" y="406" font-size="19" fill="#627488" text-anchor="middle">연기 알갱이</text>
        <text x="512" y="429" font-size="19" fill="#145a96" text-anchor="middle">= 응결핵</text>
      </g>
    </svg>
  </div>
  <div class="row"><div class="read">
    <div><span>통 속 압력</span><b id="pv">1000</b>hPa</div>
    <div class="w"><span>통 속 온도</span><b id="tv0">20.0</b>℃</div>
    <div><span>펌프질</span><b id="pn">0</b> / 20번</div>
  </div></div>
  <div class="row">
    <button class="bbtn" id="bPump">펌프질하기</button>
    <button class="bbtn orange" id="bSmoke">향 연기 넣기</button>
    <button class="bbtn white" id="bOpen">공기 다시 넣기</button>
    <button class="bbtn white" id="reset0">처음부터</button>
  </div>
  <div class="card" id="c0">공기가 팽창하면 온도가 내려가요.<br>이것이 단열 팽창이에요.</div>
</section>

<!-- 2 페트병 구름 -->
<section class="panel">
  <div class="msg" id="m1"></div>
  <div class="stage">
    <svg viewBox="0 0 600 460" role="img" aria-label="압축 마개를 끼우는 페트병. 속에 종이 온도계가 들어 있다">
      <defs><clipPath id="botIn"><path d="M278,100 V130 C278,168 224,162 224,212 V398 Q224,428 252,428 H348 Q376,428 376,398 V212 C376,162 322,168 322,130 V100 Z"/></clipPath></defs>
      <rect width="600" height="460" fill="#f4f9fd"/>
      <rect y="436" width="600" height="24" fill="#e1ebf3"/>
      <rect x="160" y="120" width="280" height="316" rx="6" fill="#1c2a3a"/>
      <!-- 병 속 압력 -->
      <text x="60" y="118" font-size="20" fill="#627488" text-anchor="middle">병 속</text>
      <text x="60" y="142" font-size="20" fill="#627488" text-anchor="middle">압력</text>
      <rect x="44" y="160" width="32" height="230" rx="16" fill="#fff" stroke="#8aa5bd" stroke-width="4"/>
      <rect id="bar" x="49" y="363" width="22" height="22" rx="11" fill="#f2a531"/>
      <text x="86" y="182" font-size="18" fill="#627488">높음</text>
      <text x="86" y="384" font-size="18" fill="#627488">보통</text>
      <!-- 병 -->
      <g id="botG">
        <path id="cloud1" d="M278,100 V130 C278,168 224,162 224,212 V398 Q224,428 252,428 H348 Q376,428 376,398 V212 C376,162 322,168 322,130 V100 Z" fill="#fff" opacity="0"/>
        <path d="M278,100 V130 C278,168 224,162 224,212 V398 Q224,428 252,428 H348 Q376,428 376,398 V212 C376,162 322,168 322,130 V100" fill="none" stroke="#9cc4e0" stroke-width="5" stroke-linecap="round"/>
        <path d="M360,222 V330" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".25"/>
      </g>
      <g id="eth" opacity="0">
        <g clip-path="url(#botIn)"><rect x="224" y="417" width="152" height="11" fill="#cfe6f7" opacity=".9"/></g>
        <g fill="#cfe6f7" opacity=".75">
          <ellipse cx="231" cy="246" rx="2.5" ry="5"/><ellipse cx="230" cy="322" rx="2.5" ry="5"/><ellipse cx="232" cy="384" rx="2.5" ry="4"/>
          <ellipse cx="369" cy="236" rx="2.5" ry="5"/><ellipse cx="370" cy="300" rx="2.5" ry="4"/><ellipse cx="368" cy="366" rx="2.5" ry="5"/>
          <ellipse cx="300" cy="196" rx="2.5" ry="4"/><ellipse cx="330" cy="268" rx="2.5" ry="4"/><ellipse cx="312" cy="352" rx="2.5" ry="4"/>
        </g>
        <text x="384" y="426" font-size="18" fill="#cfe6f7">에탄올</text>
      </g>
      <g id="strip1" transform="translate(240 190)"></g>
      <!-- 스포이트 -->
      <g id="drp" opacity="0">
        <circle id="dp" cx="300" cy="98" r="5" fill="#8ec9f0"/>
        <rect x="293" y="34" width="14" height="52" rx="5" fill="#eaf5ff" stroke="#8aa5bd" stroke-width="3"/>
        <path d="M296,86 L300,96 L304,86Z" fill="#8aa5bd"/>
        <ellipse cx="300" cy="22" rx="15" ry="14" fill="#f2a531" stroke="#a8680a" stroke-width="3"/>
        <text id="dn" x="326" y="74" font-size="22" fill="#27384a"></text>
      </g>
      <!-- 압축 마개 -->
      <g id="cap">
        <g id="plg"><rect x="296" y="6" width="8" height="40" fill="#6f8aa3"/><rect x="274" y="0" width="52" height="14" rx="7" fill="#f2a531" stroke="#a8680a" stroke-width="2"/></g>
        <rect x="284" y="36" width="32" height="50" rx="5" fill="#e6eef5" stroke="#8aa5bd" stroke-width="3"/>
        <rect x="268" y="84" width="64" height="26" rx="6" fill="#1f7ac4"/>
      </g>
    </svg>
  </div>
  <div class="row"><div class="read">
    <div class="w"><span>병 속 온도</span><b id="tv1">20.0</b>℃</div>
    <div><span>압축</span><b id="kn">0</b> / 10번</div>
  </div></div>
  <div class="steps">
    <button class="bbtn step">① 에탄올 20방울 넣기</button>
    <button class="bbtn step">② 압축하기</button>
    <button class="bbtn step">③ 마개 열기</button>
    <button class="bbtn step">④ 다시 압축하기</button>
  </div>
  <div class="row"><button class="bbtn white" id="reset1">처음부터</button></div>
  <div class="card" id="c1">압축하면 따뜻해지고,<br>한꺼번에 팽창하면 차가워져요.</div>
</section>

<!-- 3 하늘로 올라가는 공기 -->
<section class="panel">
  <div class="msg" id="m2"></div>
  <div class="stage">
    <svg id="sky" viewBox="0 0 600 460" role="img" aria-label="산이 있는 땅과 하늘. 높이 눈금과 이슬점 점선이 있고, 둥근 공기 덩어리를 위로 끌어 올릴 수 있다">
      <defs>
        <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8fd0"/><stop offset="1" stop-color="#d3e9f8"/></linearGradient>
        <clipPath id="zc"><circle cx="500" cy="106" r="71"/></clipPath>
      </defs>
      <rect width="600" height="404" fill="url(#skyG)"/>
      <path d="M330,404 L420,332 Q436,319 452,332 L500,374 L548,324 Q562,311 576,324 L600,346 V404 Z" fill="#86ad94"/>
      <rect y="404" width="600" height="56" fill="#c3d9ac"/>
      <path d="M0,404 H600" stroke="#a5c08b" stroke-width="3"/>
      <!-- 높이 눈금 -->
      <rect width="66" height="404" fill="#fff" opacity=".62"/>
      <path d="M54,404 h12 M54,292 h12 M54,180 h12 M54,68 h12" stroke="#27384a" stroke-width="3" stroke-linecap="round"/>
      <g font-size="20" fill="#27384a" text-anchor="end">
        <text x="50" y="399">0km</text><text x="50" y="299">1km</text><text x="50" y="187">2km</text><text x="50" y="75">3km</text>
      </g>
      <text x="33" y="30" font-size="19" fill="#627488" text-anchor="middle">높이</text>
      <!-- 이슬점 -->
      <path d="M66,292 H600" stroke="#145a96" stroke-width="3" stroke-dasharray="10 8"/>
      <text x="594" y="283" font-size="22" fill="#145a96" text-anchor="end">이슬점</text>
      <!-- 구름 -->

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,k)=>a+(b-a)*k;
const set=(el,o)=>{ for(const k in o) el.setAttribute(k,o[k]); };
const mix=(a,b,k)=>'rgb('+a.map((v,i)=>Math.round(lerp(v,b[i],k)))+')';

/* ---------- 소리 ---------- */
let ac;
function audio(){ if(!ac){const A=window.AudioContext||window.webkitAudioContext; if(A) ac=new A();} if(ac&&ac.state==='suspended') ac.resume(); return ac; }
function tone(freq,dur,vol,type='sine',when=0,freqEnd){
  const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+when;
  o.type=type; o.frequency.setValueAtTime(freq,t); if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
const cheer=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,.2,'triangle',i*.11));
const boo=()=>tone(220,.35,.15,'sawtooth',0,140);
const tick=()=>tone(440,.1,.06,'triangle');
const puff=()=>tone(380,.16,.07,'triangle',0,210);                                   // 펌프질
const hiss=()=>tone(900,.6,.04,'sawtooth',0,260);                                    // 공기가 다시 들어옴
const bang=()=>{ tone(170,.3,.22,'square',0,50); tone(900,.14,.06,'sawtooth',0,200); };  // 마개가 열림

/* ---------- 보상 ---------- */
function confetti(){
  const cols=['#1f7ac4','#f2a531','#7cc3f2','#ffd98a','#b7d8ef'];
  for(let i=0;i<60;i++){ const d=document.createElement('div'); d.className='conf';
    d.style.left=Math.random()*100+'vw'; d.style.background=cols[i%5]; d.style.borderRadius=i%2?'50%':'3px';
    d.style.animationDuration=1.4+Math.random()*1.6+'s'; d.style.animationDelay=Math.random()*.4+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),3600); }
}
const tabs=$$('.tab'), panels=$$('.panel');
function done(i){ if(tabs[i].classList.contains('done')) return; tabs[i].classList.add('done'); confetti(); cheer(); const c=$('#c'+i); if(c){ c.classList.add('on'); setTimeout(()=>c.scrollIntoView({behavior:'smooth',block:'nearest'}),600); } }   // 마무리 문장이 화면 아래에 가려지지 않게

/* ---------- 탭 ---------- */
let cur=0;
tabs.forEach(b=>b.onclick=()=>{ cur=+b.dataset.t; tabs.forEach((t,i)=>t.classList.toggle('on',i===cur)); panels.forEach((p,i)=>p.classList.toggle('on',i===cur)); audio(); });

/* ---------- 공유 ---------- */
$('#share').onclick=async()=>{
  const url=location.href;
  if(navigator.share){ try{ await navigator.share({title:document.title,url}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(url); }
  catch(e){ const t=document.createElement('textarea'); t.value=url; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  const el=$('#toast'); el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1800);
};

/* ---------- 종이 온도계 ---------- */
// 위 24℃ ~ 아래 16℃, 한 칸이 1℃. 지금 온도에 가까운 칸일수록 초록색으로 보임
const OFF=[38,52,68], GREEN=[52,199,110];
function mkStrip(g){
  let s='<rect x="-5" y="-5" width="50" height="224" rx="7" fill="#0f1822" stroke="#cfd9e3" stroke-width="2"/>';
  for(let i=0;i<9;i++) s+=`<rect class="cell" x="0" y="${i*24}" width="40" height="22" rx="4"/><text x="20" y="${i*24+17}" font-size="17" text-anchor="middle" fill="#fff">${24-i}</text>`;
  g.innerHTML=s; return [...g.querySelectorAll('.cell')];
}
const showStrip=(cells,T)=>cells.forEach((c,i)=>c.setAttribute('fill',mix(OFF,GREEN,clamp(1.3-1.3*Math.abs(T-(24-i))))));

/* ---------- 1 감압 용기 ---------- */
// n : 펌프질한 횟수(0~20). 압력 = 1000 − 15n (hPa), 온도 = 20 − 0.075n (℃)  → 20번에 700hPa · 18.5℃
// 온도가 조금만 내려가는 까닭 : 펌프질하는 동안 통 벽에서 열이 조금씩 들어오기 때문
let n=0, smoke=false, sv=0, Pd=1000, Td=20, fog=0, pumpK=0, openK=0, incK=0, seen0={};
const cells0=mkStrip($('#strip0'));
$('#drops0').innerHTML=$('#specks').innerHTML='<circle/>'.repeat(14);
const specks=$$('#specks circle'), drops0=$$('#drops0 circle'), zd=$$('.zd');
const M0I='통 바닥에 물을 조금 넣어 두었어요. 「펌프질하기」를 눌러 통 속 공기를 빼 보세요. 압력과 통 속 온도는 어떻게 될까요?';
function ui0(){ $('#bPump').disabled=n>=20||incK>0; $('#bSmoke').disabled=smoke||n>0||!seen0.clear; $('#bOpen').disabled=n===0; $('#pn').textContent=n; }
$('#bPump').onclick=()=>{
  n++; pumpK=1; puff();
  if(n===20) seen0[smoke?'mist':'clear']=1;
  $('#m0').textContent = n<20
    ? (smoke ? '공기가 팽창해 식으면서 수증기가 연기 알갱이(응결핵)에 맺혀요. 통 속이 점점 뿌옇게 돼요.'
             : '공기를 빼면 통 속 압력이 낮아지고, 남은 공기는 통 가득 퍼지며 부피가 커져요(팽창). 초록 칸도 보세요.')
    : (smoke ? '통 속이 뿌옇게 됐어요! 수증기가 응결핵에 맺힌 작은 물방울들, 바로 구름이에요. 「공기 다시 넣기」를 눌러 보세요.'
             : '펌프질 20번! 공기가 팽창해 통 속 온도가 1.5℃ 내려갔어요. 그런데 통 속은 거의 맑아요. 「공기 다시 넣기」를 눌러 보세요.');
  ui0();
};
$('#bSmoke').onclick=()=>{ smoke=true; incK=1; tick();
  $('#m0').textContent='향 연기를 넣었어요. 연기 알갱이는 수증기가 달라붙어 물방울이 되게 돕는 응결핵이에요. 다시 펌프질해 보세요.'; ui0(); };
$('#bOpen').onclick=()=>{
  const full=n===20; n=0; openK=1; hiss();
  $('#m0').textContent = smoke&&full ? '공기를 다시 넣으면 압력이 높아지며 통 속 온도가 올라, 물방울이 다시 수증기로 변해 맑아져요.'
    : !seen0.clear ? '공기가 들어와 통 속 온도와 압력이 되돌아왔어요. 이번에는 펌프질을 20번까지 해 보세요.'
    : !smoke ? '공기가 들어와 통 속 온도와 압력이 되돌아왔어요. 이번에는 「향 연기 넣기」를 누른 뒤 다시 펌프질해 보세요.'
    : '공기가 들어와 통 속 온도와 압력이 되돌아왔어요. 펌프질을 20번까지 하면 통 속은 어떻게 될까요?';
  if(smoke&&full) setTimeout(()=>done(0),1300);
  ui0();
};
$('#reset0').onclick=()=>{ n=0; smoke=false; incK=0; seen0={}; $('#m0').textContent=M0I; tick(); ui0(); };
function draw1(t,dt){
  const f=smoke?.85*clamp((n-2)/12):.05*n/20;     // 뿌연 정도 : 연기가 없으면 거의 맑음
  Pd+=(1000-15*n-Pd)*Math.min(1,dt*6); Td+=(20-.075*n-Td)*Math.min(1,dt*5); fog+=(f-fog)*Math.min(1,dt*(f<fog?2.5:4));
  pumpK=Math.max(0,pumpK-dt*3.2); openK=Math.max(0,openK-dt/1.3);
  if(incK>0){ incK=Math.max(0,incK-dt/2.6); if(!incK) ui0(); }
  sv+=clamp((smoke?1:0)-sv,-dt*3,dt/2.4);
  $('#pv').textContent=Math.round(Pd); $('#tv0').textContent=Td.toFixed(1); showStrip(cells0,Td);
  $('#ndl').setAttribute('transform',`rotate(${(Pd-850)*.48} 512 120)`);
  $('#ph').setAttribute('transform',`translate(0 ${-30*Math.sin(Math.PI*pumpK)})`);
  $('#plug').classList.toggle('up',openK>0||incK>0);
  set($('#inair'),{opacity:openK>0?1:0,'stroke-dashoffset':-t*120});
  $('#incense').setAttribute('opacity',incK>0?1:0); $('#wisp').setAttribute('stroke-dashoffset',-t*60);
  $('#fog').setAttribute('opacity',fog);
  const q=fog/.85;
  specks.forEach((c,i)=>{ const x=232+i*67%165+7*Math.sin(t*.7+i), y=172+i*97%222+6*Math.cos(t*.5+i*2);
    set(c,{cx:x,cy:y,r:2.2,opacity:.9*sv}); set(drops0[i],{cx:x,cy:y,r:2.2+5*q,opacity:smoke?.9*q:0}); });
  $('#zoom0').setAttribute('opacity',sv); zd.forEach((c,i)=>c.setAttribute('r',5+(12+i*2)*q));
}
$('#m0').textContent=M0I; ui0();

/* ---------- 2 페트병 구름 ---------- */
// st : 0 처음 · 1 에탄올을 넣고 닫음 · 2 다 압축함 · 3 마개를 엶(구름),  k : 압축한 횟수(0~10),  stage : 가장 멀리 가 본 단계
// 온도 : 처음 20℃ → 다 압축하면 22℃ → 마개를 열면 17℃
let st=0, stage=0, k=0, dripK=0, capK=0, capT=0, Tb=20, cl=0, pressK=0, bp=0;
const NK=10, cells1=mkStrip($('#strip1')), sBtns=$$('.step');
const M1I='빈 페트병과 압축 마개예요. ①번부터 차례로 눌러 보세요. 종이 온도계의 초록 칸이 지금 병 속 온도예요.';
function ui1(){
  const en=[st===0&&!dripK, st===1, st===2, st===3];
  sBtns.forEach((b,i)=>{ b.disabled=!en[i]; b.className='bbtn step '+(en[i]?'orange':i<stage?'white on':'white'); });
  $('#kn').textContent=st===2?NK:k;
}
function squeeze(){
  const again=st===3; k++; pressK=1; capT=1; puff();
  if(k<NK) $('#m1').textContent = again ? '다시 압축하면 병 속 온도가 올라가요. 구름이 어떻게 되는지 보세요.'
    : '마개를 누를 때마다 공기가 병 속으로 밀려 들어가요. 병이 단단해질 때까지 계속 눌러요!';
  else { st=2; stage=again?4:Math.max(stage,2);
    $('#m1').textContent = again ? '구름이 사라졌어요! 압축되어 병 속 온도가 오르자, 작은 방울이 다시 증기로 변했어요.'
      : '병이 단단해져 더 눌리지 않아요. 공기가 압축되어 병 속 온도가 2℃ 올랐어요. 이제 「마개 열기」를 눌러요.';
    if(again) done(1); }
  ui1();
}
sBtns[0].onclick=()=>{ dripK=1; tick(); $('#m1').textContent='스포이트로 에탄올을 20방울 넣어요.'; ui1(); };
sBtns[1].onclick=sBtns[3].onclick=squeeze;
sBtns[2].onclick=()=>{ st=3; stage=Math.max(stage,3); k=0; capT=0; cl=1; bang();
  $('#m1').textContent='펑! 공기가 한꺼번에 팽창해 병 속 온도가 뚝 떨어졌어요. 에탄올 증기가 응결해 하얀 구름이 생겼어요.'; ui1(); };
$('#reset1').onclick=()=>{ st=stage=k=dripK=capT=cl=0; $('#m1').textContent=M1I; tick(); ui1(); };
function draw2(t,dt){
  if(dripK>0){ dripK=Math.max(0,dripK-dt/2.8);
    if(!dripK){ st=1; stage=Math.max(stage,1); capT=1; ui1();
      $('#m1').textContent='에탄올을 병 안쪽 벽에 고루 묻히고 압축 마개로 닫았어요. 에탄올은 금방 눈에 보이지 않는 증기가 돼요.'; } }
  const d=st?1:dripK?1-dripK:0;                    // 에탄올을 넣은 정도
  const Tt=st===1?20+.2*k:st===2?22:st===3?17+.5*k:20, ct=st===3?clamp(1-k/7):0, pt=st===2?1:st?k/NK:0;
  Tb+=(Tt-Tb)*Math.min(1,dt*5); cl+=(ct-cl)*Math.min(1,dt*5); bp+=(pt-bp)*Math.min(1,dt*6);
  capK+=clamp(capT-capK,-dt/.45,dt/.45); pressK=Math.max(0,pressK-dt*3.2);
  $('#tv1').textContent=Tb.toFixed(1); showStrip(cells1,Tb);
  $('#cloud1').setAttribute('opacity',.9*cl); $('#eth').setAttribute('opacity',d);
  $('#drp').setAttribute('opacity',dripK?1:0);
  if(dripK){ const u=d*20; $('#dp').setAttribute('cy',98+318*(u%1)**2); $('#dn').textContent=Math.min(20,Math.floor(u)+1)+'방울'; }
  const o=1-capK;
  $('#cap').setAttribute('transform',`translate(${205*o} ${326*o-150*Math.sin(Math.PI*capK)}) rotate(${360*o} 300 70)`);
  $('#plg').setAttribute('transform',`translate(0 ${22*Math.sin(Math.PI*pressK)})`);
  $('#botG').setAttribute('transform',`translate(300 0) scale(${1+.035*bp} 1) translate(-300 0)`);
  set($('#bar'),{y:363-198*bp,height:22+198*bp});
}
$('#m1').textContent=M1I; ui1();

/* ---------- 3 하늘로 올라가는 공기 ---------- */
// h : 공기 덩어리의 높이(km).  둘레의 압력 = 1000 − 105h + 1.67h² (hPa)  → 1km 약 900 · 3km 약 700
// 온도 : 이슬점(1km · 10℃)까지는 1km에 10℃씩, 구름이 생긴 뒤로는 1km에 5℃씩 내려감
let h=0, hh=0, fastUp=true, drag=false, dOff=0, zone='', seen3={}, rainK=0;
const Y=v=>404-112*v, pressAt=v=>1000-105*v+1.67*v*v, tempAt=v=>v<1?20-10*v:10-5*(v-1);
const sky=$('#sky'), par=$('#par'), WARM=[246,183,85], COOL=[214,236,251];
const ZB=[[-34,-14],[-6,-30],[28,-10],[-18,26],[24,30]], ZC=[[-20,-4],[26,12]];
const zdust=$$('#zdust circle'), zdrop=$$('#zdrop circle'), zbig=$$('#zbig circle');
$('#rain').innerHTML='<line/>'.repeat(18); const rain=$$('#rain line');
const M3I='둥근 공기 덩어리를 위로 끌어 올려 보세요. 「위로 올리기」를 눌러도 돼요. 압력과 온도 숫자를 잘 보세요.';
const more=()=>!(seen3.cu&&seen3.st) ? (fastUp?' 「천천히 올라가요」도 눌러 보세요.':' 「빠르게 올라가요」도 눌러 보세요.') : seen3.rain?'':' 더 높이 올려 보세요.';
const typeMsg=()=>(fastUp?'빠르게 솟으면 위로 쌓인 적운형 구름(뭉게구름)이 돼요.':'천천히 오르면 옆으로 넓게 퍼진 층운형 구름이 돼요.')+more();
function zoneMsg(z,prev){
  const down=prev==='cloud'||prev==='rain';
  $('#m2').textContent = z==='ground' ? M3I
    : z==='low' ? (down ? '아래로 내려오면 둘레의 압력이 높아져 온도가 오르고, 물방울은 다시 수증기가 돼요.'
                        : '높이 올라갈수록 둘레의 압력이 낮아져요. 공기 덩어리는 팽창해 커지고, 온도는 내려가요.')
    : z==='cloud' ? (prev==='rain' ? typeMsg() : '이슬점에 닿았어요! 수증기가 먼지 알갱이(응결핵)에 맺혀 작은 물방울이 돼요. 구름이 생겼어요.')
    : '구름 물방울 약 100만 개가 합쳐져야 빗방울 하나가 돼요. 큰 방울이 되어 비가 내려요!'+more();
}
const svgY=e=>{ const p=sky.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(sky.getScreenCTM().inverse()).y; };
par.addEventListener('pointerdown',e=>{ e.preventDefault(); audio(); par.setPointerCapture(e.pointerId); drag=true; dOff=svgY(e)-Y(hh); $('#hint3').style.display='none'; });
par.addEventListener('pointermove',e=>{ if(drag) h=hh=clamp((404-(svgY(e)-dOff))/112,0,3); });
par.addEventListener('pointerup',()=>drag=false); par.addEventListener('pointercancel',()=>drag=false);
par.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});   // 끄는 동안 화면이 같이 밀리지 않게
$('#bUp').onclick=()=>{ h=Math.min(3,h+.5); $('#hint3').style.display='none'; tone(420,.18,.06,'sine',0,640); };
$('#reset3').onclick=()=>{ h=0; tick(); };
function pick(f){ fastUp=f; $('#bFast').classList.toggle('on',f); $('#bSlow').classList.toggle('on',!f);
  $('#bFast').setAttribute('aria-pressed',f); $('#bSlow').setAttribute('aria-pressed',!f); tick();
  if(hh>=1){ seen3[f?'cu':'st']=1; $('#m2').textContent=typeMsg(); }
  else $('#m2').textContent=(f?'빠르게':'천천히')+' 올라가는 공기를 골랐어요. 이슬점 점선까지 올려 보세요.'; }
$('#bFast').onclick=()=>pick(true); $('#bSlow').onclick=()=>pick(false);
function draw3(t,dt){
  const v=fastUp?1.5:.45; if(!drag) hh+=clamp(h-hh,-v*dt,v*dt);     // 버튼으로 올릴 때의 빠르기
  const T=tempAt(hh), P=Math.round(pressAt(hh)/10)*10, r=28+16*hh/3, cloud=hh>=1, g=clamp((hh-1)/2);
  const z=hh<.02?'ground':hh<1?'low':hh<2.6?'cloud':'rain';
  if(cloud) seen3[fastUp?'cu':'st']=1; if(z==='rain') seen3.rain=1;
  if(z!==zone){ zoneMsg(z,zone); zone=z; }
  if(seen3.cu&&seen3.st&&seen3.rain) done(2);
  $('#bUp').disabled=h>=3;
  $('#hv').textContent=hh.toFixed(1); $('#pv3').textContent=P; $('#tv3').textContent=Math.round(T);
  par.setAttribute('transform',`translate(262 ${Y(hh)})`); $('#pT').textContent=P+'hPa'; $('#tT').textContent=Math.round(T)+'℃';
  set($('#pc'),{r,fill:mix(COOL,WARM,clamp(T/20))});
  // 구름 : 빠르게 = 위로 쌓임(적운형), 천천히 = 옆으로 퍼짐(층운형)
  $('#cu').setAttribute('transform',`translate(262 293) scale(${lerp(.55,1,g)} ${lerp(.3,1.15,g)})`);
  $('#st').setAttribute('transform',`translate(262 293) scale(${lerp(.45,1,g)} ${lerp(.8,1.6,g)})`);
  $('#cu').style.opacity=cloud&&fastUp?1:0; $('#st').style.opacity=cloud&&!fastUp?1:0;
  $('#ctype').style.opacity=cloud?1:0; if(cloud) $('#ctype').textContent=fastUp?'적운형 구름':'층운형 구름';
  const rn=z==='rain', W=fastUp?74:150;
  $('#rain').style.opacity=rn?1:0;
  rain.forEach((l,i)=>{ const x=262+(i/17-.5)*2*W, y=296+(t*150+i*41)%100; set(l,{x1:x,y1:y,x2:x-3,y2:y+13}); });
  // 크게 보기 : 응결핵 → 작은 물방울 → 합쳐져 큰 방울 → 떨어짐
  const dk=clamp((hh-1)/.5), u=t%3.2/3.2, m=rn&&u<.5?u/.5:0, fall=rn&&u>=.5?(u-.5)/.5:0;
  ZB.forEach(([bx,by],i)=>{ const [cx,cy]=ZC[i<3?0:1], x=500+lerp(bx,cx,m), y=106+lerp(by,cy,m);
    set(zdust[i],{cx:x,cy:y}); set(zdrop[i],{cx:x,cy:y,r:4+7*dk,opacity:cloud?(fall?fall:1-.5*m):0}); });
  zbig.forEach((c,i)=>set(c,{cx:500+ZC[i][0],cy:106+ZC[i][1]+170*fall*fall,r:rn?(fall?17:17*m):0}));
  $('#zcap').textContent=!cloud?'먼지 알갱이가 떠 있어요':rn?'합쳐져 큰 방울이 돼요':'작은 물방울이 맺혀요';
}
$('#m2').textContent=M3I;

/* ---------- 4 OX 퀴즈 ---------- */
const QS=[
 ['구름은 눈에 보이지 않는 수증기가 모인 것이다','X','구름은 수증기가 응결한 아주 작은 물방울들이에요. 수증기는 눈에 보이지 않아요.'],
 ['공기는 팽창하면 온도가 내려간다','O','공기는 팽창할 때 가진 열에너지를 써서 온도가 내려가요.'],
 ['공기가 하늘 높이 올라가면 둘레의 압력이 낮아진다','O','압력은 하늘 높이 올라갈수록 낮아져요.'],
 ['응결핵이 있으면 수증기가 물방울로 더 쉽게 변한다','O','응결핵은 수증기가 달라붙어 물방울이 되게 돕는 알갱이예요.'],
 ['수증기량이 그대로일 때 기온이 오르면 상대 습도도 높아진다','X','기온이 오르면 포화 수증기량이 커져서 상대 습도는 낮아져요.']
];
let qi=0, score=0;
function showQ(){
  $('#ox').style.display=''; $('#qn').textContent=qi+1; $('#sc').textContent=score; $('#q').textContent=QS[qi][0];
  $('#qfb').textContent=''; $('#qfb').className='fb'; $('#next').style.display='none'; $$('#ox button').forEach(b=>b.disabled=false);
}
$$('#ox button').forEach(b=>b.onclick=()=>{
  const [,ans,why]=QS[qi], ok=b.dataset.a===ans; $$('#ox button').forEach(x=>x.disabled=true);
  if(ok){ score++; cheer(); } else boo();
  $('#sc').textContent=score; $('#qfb').className='fb '+(ok?'good':'bad');
  $('#qfb').textContent=(ok?'딩동댕! ':'아쉬워요. 정답은 '+ans+'예요. ')+why;
  $('#next').textContent=qi<4?'다음 문제':'결과 보기'; $('#next').style.display='';
});
$('#next').onclick=()=>{
  if(qi===5){ qi=0; score=0; showQ(); return; }
  if(++qi<5){ showQ(); return; }
  $('#q').textContent=`5문제 중 ${score}문제를 맞혔어요!`; $('#ox').style.display='none'; $('#qfb').className='fb good';
  $('#qfb').textContent=score===5?'완벽해요! 구름 박사님이네요.':score>=3?'잘했어요! 틀린 문제는 앞의 실험으로 다시 확인해 보세요.':'괜찮아요. 앞의 실험을 다시 해 보고 또 도전해요!';
  $('#next').textContent='다시 하기'; if(score===5){ tabs[3].classList.add('done'); confetti(); cheer(); }
};
showQ();

/* ---------- 그리기 ---------- */
const draws=[draw1,draw2,draw3,()=>{}];
let last=0;
(function loop(now){ const dt=Math.min(.25,(now-last)/1000); last=now; draws[cur](now/1000,dt); requestAnimationFrame(loop); })(0);
</script>
